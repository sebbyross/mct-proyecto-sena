{% extends "admin.html" %}
{% block title %}Editar Usuario - MCT{% endblock %}
{% block content %}
<div class="card p-4">
  <h3>Editar Usuario</h3>
  <form method="POST" action="{{ url_for('users_editar', id=user[0]) }}">
    <div class="mb-3">
      <label class="form-label">Usuario</label>
      <input name="username" class="form-control" value="{{ user[1] }}" required>
    </div>
    <div class="mb-3 form-check">
      <input type="checkbox" name="adminstatus" value="1" class="form-check-input" id="adminCheck" {% if user[3]|int == 1 %}checked{% endif %}>
      <label class="form-check-label" for="adminCheck">Administrador</label>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-primary" type="submit">Guardar</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('users') }}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
