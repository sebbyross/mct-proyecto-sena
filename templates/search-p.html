{% extends "admin.html" %}
{% block title %}Buscar producto{% endblock %}
{% block content %}
<div class="card p-4">
  <h3>Buscar producto</h3>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">ID del producto</label>
      <input name="id" class="form-control" placeholder="Escribe ID del producto">
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-primary" type="submit">Buscar</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('productos') }}">Volver</a>
    </div>
  </form>
</div>
{% endblock %}
