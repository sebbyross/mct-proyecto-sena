{% extends "admin.html" %}
{% block title %}Contacto - MCT{% endblock %}

{% block content %}
<div class="card p-4">
  <h3>Contáctanos</h3>
  <p class="parag2">¿Tienes preguntas o deseas comunicarte con nosotros? Llena el siguiente formulario y te responderemos pronto.</p>
  <form method="POST">
    <div class="mb-3">
      <input type="text" class="form-control" name="name" placeholder="Tu nombre">
    </div>
    <div class="mb-3">
      <input type="email" class="form-control" name="email" placeholder="Tu correo electrónico">
    </div>
    <div class="mb-3">
      <textarea class="form-control" name="message" rows="4" placeholder="Tu mensaje"></textarea>
    </div>
    <button type="submit" class="btn btn-danger">Enviar mensaje</button>
  </form>

  <div class="mt-3">
    <p class="mb-0"><strong>Email:</strong> soporte@mct.example</p>
    <p class="mb-0"><strong>Tel:</strong> +57 300 000 0000</p>
  </div>
</div>
{% endblock %}
