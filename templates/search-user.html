{% extends "admin.html" %}
{% block title %}Buscar usuario{% endblock %}
{% block content %}
<div class="card p-4">
  <h3>Buscar usuario</h3>
  <form method="GET" action="{{ url_for('search_user') }}">
    <div class="mb-3">
      <label class="form-label">Usuario</label>
      <input name="q" class="form-control" placeholder="Nombre de usuario">
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-primary" type="submit">Buscar</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('users') }}">Volver</a>
    </div>
  </form>
</div>
{% endblock %}
