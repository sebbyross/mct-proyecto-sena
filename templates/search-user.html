{% extends "admin.html" %}
{% block title %}Buscar usuario{% endblock %}
{% block content %}
<div class="card p-4">
  <h3>Buscar usuario por ID</h3>
  <form method="POST" action="{{ url_for('search_by_id') }}">
    <div class="mb-3">
      <label class="form-label">ID de usuario</label>
      <input name="id" class="form-control" placeholder="Escribe ID" required>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-primary" type="submit">Buscar</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('user_list') }}">Volver</a>
    </div>
  </form>
</div>
{% endblock %}
