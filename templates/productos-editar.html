{% extends "admin.html" %}
{% block title %}Editar Producto - MCT{% endblock %}
{% block content %}
<div class="card p-4">
  <h3 class="mb-4">Editar Producto</h3>
  <form action="{{ url_for('editar_producto', id=producto[0]) }}" method="POST" autocomplete="off">
    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input name="nombre" class="form-control" value="{{ producto[1] }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Descripción</label>
      <textarea name="descripcion" class="form-control" rows="3">{{ producto[2] }}</textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Precio</label>
      <input name="precio" type="number" step="0.01" class="form-control" value="{{ producto[3] }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Stock</label>
      <input name="stock" type="number" min="0" class="form-control" value="{{ producto[4] if producto|length > 4 else 0 }}" required>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Actualizar</button>
      <a href="{{ url_for('productos') }}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
