{% extends "admin.html" %}
{% block title %}Resultado búsqueda usuario{% endblock %}

{% block content %}
<h3>Resultado</h3>
{% if user %}
<div class="card p-3">
  <dl class="row mb-0">
    <dt class="col-sm-3">ID</dt><dd class="col-sm-9">{{ user[0] }}</dd>
    <dt class="col-sm-3">Usuario</dt><dd class="col-sm-9">{{ user[1] }}</dd>
    <dt class="col-sm-3">Admin</dt><dd class="col-sm-9">{{ user[3] }}</dd>
  </dl>
  <div class="mt-3">
    <a class="btn btn-sm btn-outline-primary" href="{{ url_for('editar_usuario', id=user[0]) }}">Editar</a>
    <a class="btn btn-sm btn-outline-danger" href="{{ url_for('eliminar_usuario', id=user[0]) }}" onclick="return confirm('Eliminar usuario?')">Eliminar</a>
  </div>
</div>
{% else %}
<div class="card p-3">No se encontró el usuario.</div>
{% endif %}
{% endblock %}
